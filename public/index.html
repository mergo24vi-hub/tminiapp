<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telegram Mini App — User ID</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #111111);
        }
        #line { font-size: 18px; white-space: nowrap; }
    </style>
</head>
<body>
<div id="line">Завантаження…</div>

<script>
    (function () {
        const el = document.getElementById('line');
        const tg = window.Telegram && window.Telegram.WebApp;

        if (!tg) {
            el.textContent = 'Відкрийте цю сторінку всередині Telegram';
            return;
        }

        // Готуємо Mini App (настроює тему, повідомляє Telegram, що все ок)
        tg.ready();

        // Спроба взяти id з авторизованого контексту Mini App
        const userId = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;

        if (userId) {
            el.textContent = `Ваш Telegram ID: ${userId}`; // одна строка на екрані
        } else {
            // Якщо користувача немає у контексті (наприклад, відкрито поза Telegram)
            el.textContent = 'Авторизацію не отримано';
        }
    })();
</script>
</body>
</html>
