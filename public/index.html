    // -------------------------
    // 2) Утиліти

    const formatDateUA = iso =>
        new Intl.DateTimeFormat('uk-UA',{ day:'numeric', month:'long' })
            .format(new Date(iso));

    function el(tag, attrs = {}, children = []) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
            if (k === 'className') node.className = v;
            else if (k.startsWith('on') && typeof v === 'function')
                node.addEventListener(k.slice(2).toLowerCase(), v);
            else node.setAttribute(k, v);
        }
        for (const c of children) node.append(c);
        return node;
    }

    // -------------------------
    // 3) Стан
    // -------------------------
    const state = {
        expandedId: null
    };

    // -------------------------
    // 4) Рендер
    // -------------------------
    const app = document.getElementById('app');

    function renderHeader() {
        return el('div', { className:'header' }, ['Події (за датою ↑)']);
    }

    function renderList(items) {
        const wrap = el('div', { className:'wrap' });

        for (const it of items) {
            const isExpanded = state.expandedId === it.id;

            const row = el('div', { className:'row' }, [
                el('div', { className:'left' }, [
                    el('div', { className:'date' }, [formatDateUA(it.event_date)]),
                    el('div', { className:'brief' }, [it.brief]),
                ]),
            ]);

            row.addEventListener('click', () => {
                state.expandedId = (state.expandedId === it.id) ? null : it.id;
                render(); // перемалювати
            });

            const card = el('div', { className:'item' }, [row]);

            if (isExpanded) {
                card.append(el('div', { className:'full' }, [it.fulltext]));
            }

            wrap.append(card);
        }

        return wrap;
    }

    function render() {
        app.innerHTML = '';
        app.append(renderHeader());

        // Сортування за зростанням дати (ISO YYYY-MM-DD)
        const sorted = [...events].sort((a, b) => {
            const ta = Date.parse(a.event_date) || 0;
            const tb = Date.parse(b.event_date) || 0;
            return (ta - tb) || ((a.id ?? 0) - (b.id ?? 0));
        });

        app.append(renderList(sorted));
    }

    // -------------------------
    // 5) Старт
    // -------------------------
    render();
