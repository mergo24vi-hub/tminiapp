<div id="app"></div>
<script>

    const votes = new Map(); // id -> array of voters (приклад)
    const state = { expandedId: null };

    const fDate = iso => new Intl.DateTimeFormat('uk-UA',{ day:'numeric', month:'long'}).format(new Date(iso));

    const app = document.getElementById('app');
    app.style.cssText = `
  font: 14px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial, sans-serif;
  color:#111;background:#fff;
`;
    const css = document.createElement('style');
    css.textContent = `
.list { display:flex; flex-direction:column; gap:8px; padding:12px; }
.item { border:1px solid #e5e5e5; border-radius:12px; padding:10px 12px; background:#fafafa; }
.row { display:flex; justify-content:space-between; gap:12px; align-items:center; cursor:pointer; }
.left { display:flex; flex-direction:column; gap:4px; }
.date { font-weight:600; }
.brief { color:#333; }
.actions { display:flex; align-items:center; gap:10px; }
.btn { border:none; background:transparent; font-size:20px; line-height:1; cursor:pointer; }
.full { margin-top:8px; padding-top:8px; border-top:1px dashed #ddd; color:#222; }
.voters { font-size:12px; color:#555; }
`;
    document.head.append(css);

    function render() {
        app.innerHTML = '';
        const list = document.createElement('div');
        list.className = 'list';

        for (const it of data) {
            const item = document.createElement('div');
            item.className = 'item';

            const row = document.createElement('div');
            row.className = 'row';

            const left = document.createElement('div');
            left.className = 'left';

            const d = document.createElement('div');
            d.className = 'date';
            d.textContent = fDate(it.event_date); // "9 жовтня"

            const b = document.createElement('div');
            b.className = 'brief';
            b.textContent = it.brief;

            left.append(d, b);

            const actions = document.createElement('div');
            actions.className = 'actions';

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = '👍'; // емодзі-кнопка голосу

            const voters = votes.get(it.id) ?? [];
            const votersEl = document.createElement('div');
            votersEl.className = 'voters';
            votersEl.textContent = voters.length ? `Голоси: ${voters.join(', ')}` : 'Голосів поки нема';

            actions.append(btn);
            row.append(left, actions);

            // Клік по рядку — розгорнути/згорнути (один за раз)
            row.addEventListener('click', (e) => {
                // не реагуємо, якщо клік по кнопці
                if (e.target === btn) return;
                state.expandedId = (state.expandedId === it.id) ? null : it.id;
                render();
            });

            // Клік по голосуванню
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                // приклад: додаємо локального "user123"; у реалі — Telegram.WebApp.initDataUnsafe.user.username/id
                const me = 'user123';
                const arr = votes.get(it.id) ?? [];
                if (!arr.includes(me)) arr.push(me);
                votes.set(it.id, arr);
                render();
            });

            item.append(row, votersEl);

            // Показуємо fulltext лише якщо цей item активний
            if (state.expandedId === it.id) {
                const full = document.createElement('div');
                full.className = 'full';
                full.textContent = it.fulltext;
                item.append(full);
            }

            list.append(item);
        }

        app.append(list);
    }

    render();
</script>
